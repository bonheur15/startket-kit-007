# Local Postgres for development.
#
#   docker compose up -d
#   make db-push          # create the tables
#   make dev
#
# Matches the default DATABASE_URL in engine/.env.example.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starterkit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starterkit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
